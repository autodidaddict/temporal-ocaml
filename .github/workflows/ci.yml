name: ci

on:
  push:
    branches: [main]
  pull_request:

# Linux only for now. macOS and Windows need per-platform native link flags and
# path/toolchain handling for the Rust bridge; add them back once that's real.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # protoc is a real system dependency: sdk-core's proto crate runs
      # tonic-prost-build at compile time.
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.x"

      - uses: dtolnay/rust-toolchain@stable

      # Cache the (large) sdk-core dependency compile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/temporal_bridge

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install OCaml deps
        run: opam install . --deps-only --yes

      # dune builds the Rust staticlib itself (cargo runs inside the dune graph;
      # see lib/dune), so there's no separate staging step.
      - name: Build
        run: opam exec -- dune build examples/ecommerce/main.exe

      # The replay tests drive the engine directly, with no FFI call and no server,
      # so they need nothing beyond the build above. They are where the determinism
      # guarantees are pinned, so a green build without them means little.
      # scripts/livetest.sh is not run here: it needs the temporal CLI and a dev
      # server, which is a larger addition than this job currently carries.
      - name: Test
        run: opam exec -- dune test
